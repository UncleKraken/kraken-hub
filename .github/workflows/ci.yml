name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-and-web:
    name: Host + web (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows is what the cafés run; Linux keeps us honest about portability.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: bash scripts/ci-run.sh npm ci
      - run: bash scripts/ci-run.sh npm run typecheck
      - run: bash scripts/ci-run.sh npm test
      - run: bash scripts/ci-run.sh npm run build
      - name: Smoke test the built host
        run: bash scripts/ci-run.sh bash scripts/smoke.sh
